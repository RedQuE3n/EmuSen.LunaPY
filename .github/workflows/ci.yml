# The suite, on every push and pull request.
#
# No display server anywhere in here, and that is worth stating because it is
# not free in a GUI toolkit: `lunapy.testing` sets QT_QPA_PLATFORM=offscreen on
# import, so windows are created, laid out, focused and rendered on a bare
# runner. A Tk equivalent of this file would need Xvfb installed and wrapped
# around the command.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so publish.yml runs THIS suite rather than its own copy of it.
  # It had a copy for about an hour and the copy was already wrong: it omitted
  # the Qt libraries below, so the first tagged build failed at import with
  # "libEGL.so.1: cannot open shared object file". Two places to describe how
  # to run the tests is one place too many.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject requires-python says, and the ceiling is
        # what BIMA runs. Testing only one of them makes the other a claim.
        python-version: ['3.10', '3.12', '3.14']

    steps:
      # Current majors, both node24. These were @v4 and @v5, which GitHub was
      # already force-running on Node 24 while printing a deprecation warning on
      # every job — so the pins described a runtime that had stopped being used.
      # A warning nobody can act on is a warning people learn to scroll past,
      # and the next real one scrolls past with it.
      #
      # Majors, not SHAs. Pinning a SHA is the supply-chain-hardened choice and
      # is the right call for a workflow with secrets in reach; this one has
      # none, and publish.yml has no stored token either (it exchanges an OIDC
      # token that GitHub scopes to this repo and workflow). The cost of SHAs is
      # that security patches arrive only when somebody bumps them by hand, and
      # an unattended repo does not get bumped. Revisit if a secret ever lands
      # in either file.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Qt needs a handful of X libraries present even to run offscreen: the
      # platform plugin is loaded either way, and it links against libEGL and
      # libxkbcommon. A runner without them fails at import with "could not load
      # the Qt platform plugin", which reads like a code fault and is not one.
      - name: Qt's shared library dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 libdbus-1-3

      - run: pip install -r requirements.txt
      - run: python -m pytest -q
