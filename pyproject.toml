[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "emusen-lunapy"
# THE VERSION COMES FROM THE GIT TAG, not from this file. A version written in
# two places is a version that will eventually disagree with itself, and PyPI is
# less forgiving of that than NuGet: a version cannot be re-uploaded AT ALL, so
# publishing under the wrong number burns it permanently. setuptools_scm reads
# the tag at build time; a build from an untagged tree gets a .dev version,
# which is a local build saying so rather than pretending to be a release.
dynamic = ["version"]
description = "A small Qt toolkit: a theme, a fluent layout surface, and a harness that can tell whether a window actually rendered."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tristan Pelland" }]
keywords = ["qt", "pyside6", "gui", "toolkit", "theme"]

# Qt is the one dependency, and it is LGPL-3.0. That is a decision with a reason
# and a consequence, both recorded in docs/LunaPY.md §1.2 — a consumer of this
# MIT package inherits Qt's terms, and the place to find that out is the design
# record rather than a licence audit six months later.
#
# `PySide6-Essentials`, NOT the `PySide6` metapackage. The metapackage is
# Essentials plus Addons, and Addons is Qt3D, Charts, Multimedia, WebEngine and
# 32 other modules weighing 416MB that nothing here imports — measured at
# 6.11.1, a venv holding this package went from 721MB to 305MB by naming
# Essentials. This does not restrict the consumer: `PySide6` itself depends on
# `PySide6-Essentials`, so an application that wants QtCharts installs the
# metapackage and both constraints are satisfied. What it stops is a consumer
# who wants none of it paying for all of it. `tests/test_layering.py` keeps the
# import surface inside Essentials, because on a developer machine that already
# has the metapackage the mistake is invisible.
dependencies = ["PySide6-Essentials>=6.5"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/RedQuE3n/EmuSen.LunaPY"
Source = "https://github.com/RedQuE3n/EmuSen.LunaPY"

# `emusen-lunapy` on PyPI, `lunapy` in an import statement. The prefix is the
# one LunaP's NuGet id already carries, from where both were written; `lunapy`
# alone was taken on PyPI, and the prefix resolves that without inventing a
# third name for the same thing. Nothing here depends on anything of EmuSen's —
# tests/test_layering.py asserts exactly that.
[tool.setuptools]
packages = ["lunapy"]

[tool.setuptools_scm]
# `v0.4.0` -> `0.4.0`. The tag is the whole input.
tag_regex = "^v(?P<version>[0-9].*)$"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Qt writes a line of platform noise to stderr under the offscreen plugin that
# has nothing to say about the test that produced it.
filterwarnings = ["error::DeprecationWarning"]
